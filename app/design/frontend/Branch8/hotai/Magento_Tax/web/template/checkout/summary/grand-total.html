<!-- ko if: isTaxDisplayedInGrandTotal && isDisplayed() -->
<tr class="grand totals incl">
    <th class="mark" scope="row">
        <strong data-bind="i18n: inclTaxLabel"></strong>
    </th>
    <td data-bind="attr: {'data-th': inclTaxLabel}" class="amount">
        <strong><span class="price" data-bind="text: getValue()"></span></strong>
    </td>
</tr>
<tr class="grand totals excl">
    <th class="mark" scope="row">
        <strong data-bind="i18n: exclTaxLabel"></strong>
    </th>
    <td data-bind="attr: {'data-th': exclTaxLabel}" class="amount">
        <strong><span class="price" data-bind="text: getGrandTotalExclTax()"></span></strong>
    </td>
</tr>
<!-- /ko -->
<!-- ko if: !isTaxDisplayedInGrandTotal && isDisplayed() -->
<tr class="grand totals">
    <th class="mark" scope="row">
        <strong data-bind="i18n: getGrandInclPointLabel()"></strong>
    </th>
    <td data-bind="attr: {'data-th': getGrandInclPointLabel()}" class="amount">
        <strong><span class="price" data-bind="text: getValue()"></span></strong>
    </td>
</tr>
<tr class="grand totals excl-points">
    <th class="mark" scope="row">
        <strong class="desktop-label" data-bind="i18n: exclPointLabel"></strong>
        <strong class="mobile-label" data-bind="i18n: exclPointLabelMobile"></strong>
    </th>
    <td data-bind="attr: {'data-th': exclPointLabel}" class="amount">
        <strong><span class="price" data-bind="text: getTotalExclPoint()"></span></strong>
    </td>
</tr>
<!-- /ko -->
<!-- ko if: isBaseGrandTotalDisplayNeeded() && isDisplayed() -->
<tr class="totals charge">
    <th class="mark" data-bind="i18n: basicCurrencyMessage" scope="row"></th>
    <td class="amount">
        <span class="price" data-bind="text: getBaseValue(), attr: {'data-th': basicCurrencyMessage}"></span>
    </td>
</tr>
<!-- /ko -->
<tr class="totals total-incl-point">
    <td colspan="2">
        <span class="label-excl-point" data-bind="text: getLabelExclPoint()"></span><span class="amount-excl-point" data-bind="text: getTotalExclPoint()"></span>
        <span class="label-point" data-bind="text: getLabelPoint(), class: noPointClass()"></span> <span class="label-point-amount" data-bind="text: getPointMoneyFormated(), class: noPointClass()"></span>
    </td>
</tr>
