<div class="action-select-wrap" css="_active: opened" outerClick="close.bind($data)">
    <button class="action-select" attr="title: $t('Select Items')" click="toggleOpened">
        <span translate="'Actions'"></span>
    </button>
    <div class="action-menu-items">
        <ul class="action-menu" each="data: actions, as: 'action'" css="_active: opened">
            <li css="_visible: $data.visible, _parent: $data.actions">
                <!-- ko if: $data.type === 'assign-sources' || $data.type === 'unassign-sources' || $data.type === 'inventory-transfer' -->
                <span class="action-menu-item" style="pointer-events:none;opacity:0.5;" translate="label" click="$parent.applyAction.bind($parent, type)"></span>
                <!-- /ko -->
                <!-- ko if: $data.type !== 'assign-sources' && $data.type !== 'unassign-sources' && $data.type !== 'inventory-transfer' -->
                <span class="action-menu-item" translate="label" click="$parent.applyAction.bind($parent, type)"></span>
                <!-- /ko -->
                <render args="name: $parent.submenuTemplate, data: $parent" if="$data.actions"></render>
            </li>
        </ul>
    </div>
</div>
