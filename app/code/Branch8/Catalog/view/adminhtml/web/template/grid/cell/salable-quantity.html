<div class="data-grid-cell-content">
    <ul data-bind="foreach: { data: $col.getSalableQuantityData($row()), as: '$salableQuantityData' }">
        <li>
            <!-- ko if: $salableQuantityData.variation_stock -->
                <!-- ko foreach: { data: $salableQuantityData.variation_stock, as: 'item' } -->
                    <p><strong data-bind="text: item.comb"></strong> : <span data-bind="text: item.stock"></span></p>
                <!-- /ko -->
            <!-- /ko -->
            <!-- ko if: !$salableQuantityData.manage_stock -->
            <span data-bind="i18n: 'No manage stock'"></span><br>
            <!-- /ko -->
            <!-- ko if: $salableQuantityData.message -->
            <span data-bind="text: $salableQuantityData.message"></span>
            <!-- /ko -->
            <!-- ko if: $salableQuantityData.stock_name -->
            <strong data-bind="text: $salableQuantityData.stock_name"></strong>:
            <span data-bind="text: $salableQuantityData.qty"></span>
            <!-- /ko -->
        </li>
    </ul>
</div>
