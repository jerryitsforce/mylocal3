<div class="opc-section buyer-information">
    <h3 class="step-title amcheckout-title"
       data-amcheckout-js="step-title"
       data-bind="i18n: 'Purchaser Information'"
       data-role="title"></h3>
    <div id="checkout-step-buyer-information"
         class="step-content amcheckout-content"
         data-amcheckout-js="step-content"
         data-role="content"
         data-bind="mageInit: {'checkoutCollapsibleSteps': {}}">
        <div class="amcheckout-wrapper">
            <!-- ko ifnot: isCustomerLoggedIn() -->
                <!-- ko foreach: getRegion('before-login-form') -->
                <!-- ko template: getTemplate() --><!-- /ko -->
                <!-- /ko -->
                <form class="form form-login" data-role="email-with-possible-login"
                      data-bind="submit:login"
                      method="post">
                    <fieldset id="customer-email-fieldset" class="fieldset" data-bind="blockLoader: isLoading">
                        <div class="field required">
                            <label class="label" for="customer-email"><span data-bind="i18n: 'Email Address'"></span></label>
                            <div class="control" data-bind="css: {'_with-tooltip': !!getTooltip()}">
                                <input class="input-text"
                                       type="email"
                                       data-bind="
                                            textInput: email,
                                            hasFocus: emailFocused,
                                            afterRender: emailHasChanged,
                                            mageInit: {'mage/trim-input':{}}"
                                       name="username"
                                       data-validate="{required:true, 'validate-email':true}"
                                       id="customer-email" >
                                <!-- ko if: getTooltip() -->
                                <!-- ko template: 'Amasty_CheckoutCore/form/element/tooltip' --><!-- /ko -->
                                <!-- /ko -->
                                <span class="note" data-bind="fadeVisible: isPasswordVisible() == false"><!-- ko i18n: 'You can create an account after checkout.'--><!-- /ko --></span>
                            </div>
                        </div>

                        <!--Hidden fields -->
                        <fieldset class="fieldset hidden-fields" data-bind="fadeVisible: isPasswordVisible">
                            <div class="field">
                                <label class="label" for="customer-password"><span data-bind="i18n: 'Password'"></span></label>
                                <div class="control">
                                    <input class="input-text"
                                           data-bind="
                                                attr: {
                                                    placeholder: $t('Password'),
                                                }"
                                           type="password"
                                           name="password"
                                           id="customer-password"
                                           data-validate="{required:true}" autocomplete="off">
                                    <span class="note" data-bind="i18n: 'You already have an account with us. Sign in or continue as guest.'"></span>
                                </div>

                            </div>
                            <!-- ko foreach: getRegion('additional-login-form-fields') -->
                            <!-- ko template: getTemplate() --><!-- /ko -->
                            <!-- /ko -->
                            <div class="actions-toolbar">
                                <input name="context" type="hidden" value="checkout" >
                                <div class="primary">
                                    <button type="submit" class="action login primary" data-action="checkout-method-login"><span data-bind="i18n: 'Login'"></span></button>
                                </div>
                                <div class="secondary">
                                    <a class="action remind" data-bind="attr: { href: forgotPasswordUrl }">
                                        <span data-bind="i18n: 'Forgot Your Password?'"></span>
                                    </a>
                                </div>
                            </div>
                        </fieldset>
                        <!--Hidden fields -->
                    </fieldset>
                </form>
            <!-- /ko -->

            <!-- ko if: isCustomerLoggedIn() -->
            <div id="customer-info" class="buyer-detail">
                <div class="buyer-detail-field">
                    <label class="label"><span data-bind="i18n: 'Name'"></span></label>
                    <div class="control">
                        <span data-bind="text: customerName()"></span>
                    </div>
                </div>
                <div class="buyer-detail-field">
                    <label class="label"><span data-bind="i18n: 'Phone Number'"></span></label>
                    <div class="control">
                        <span data-bind="text: customerPhoneNumber()"></span>
                    </div>
                </div>
                <div class="buyer-detail-field">
                    <label class="label"><span data-bind="i18n: 'Email'"></span></label>
                    <div class="control">
                        <span data-bind="text: customerEmail()"></span>
                    </div>
                </div>
            </div>
            <!-- /ko -->
        </div>
    </div>
</div>
