<div class="opc-gift-to-friend-section">
  <div class="opc-gift-to-friend-options">
    <div class="opc-gift-to-friend-option">
      <input type="radio" name="recipientFill" id="recipientFillYes"
        data-bind="checked: recipientFillOption, checkedValue: 2">
      <label for="recipientFillYes" data-bind="i18n: '分享連結給收禮人填寫收件資訊'"></label>
      <button class="action primary action-gift-recipient-note" type="button" data-role="action"
        click="showGiftRecipientFillNote">
        <span translate="'Note'"></span>
      </button>
    </div>
    <div class="opc-gift-to-friend-option">
      <input type="radio" name="recipientFill" id="recipientFillNo"
        data-bind="checked: recipientFillOption, checkedValue: 1">
      <label for="recipientFillNo" data-bind="i18n: '由我填收件資訊'"></label>
      <button class="action primary action-gift-recipient-note" type="button" data-role="action"
        click="showGiftRecipientFillNote">
        <span translate="'Note'"></span>
      </button>
    </div>
  </div>
  <form class="form form-shipping-address form-gift-to-friend-address" id="co-shipping-form-gift"
    data-bind="attr: {'data-hasrequired': $t('* Required Fields')}, visible: recipientFillOption() === 1">
    <div id="gift-to-friend-form" class="shipping-address-wrappper" data-bind="afterRender: onAfterRendeGiftToFriend()">
      <div class="address-fieldset" id="gift-to-friend-fieldset">
        <fieldset id="gift-to-friend-address-fieldset" class="fieldset address">
          <!-- ko foreach: getRegion('gift-to-friend-fieldset') -->
          <!-- ko template: getTemplate() --><!-- /ko -->
          <!--/ko-->
        </fieldset>
        <div class="form-action" data-bind="visible: false">
          <button id="gift-address-button" class="action primary action-save-address" type="button" data-role="action"
            click="useGiftAddress">
            <span translate="'Save'"></span>
          </button>
        </div>
      </div>
    </div>
  </form>
  <div class="opc-gift-to-friend-note">
    <h4 class="opc-gift-to-friend-note-title" data-bind="i18n: '贈送禮物說明'"></h4>
    <ul class="opc-gift-to-friend-note-desc">
      <li data-bind="i18n: '結帳完成後會生成一個連結，供您分享給收禮人讓他們填寫收件資訊。'"></li>
      <li data-bind="i18n: '收件資訊僅用於本次禮物的配送，購買人將不會知道具體地址資訊。'"></li>
      <li data-bind="i18n: '收禮人14 天內未填寫收件資訊訂單將自動取消。'"></li>
    </ul>
  </div>
